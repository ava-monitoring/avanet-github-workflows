name: Build master

on:
  workflow_call:
    inputs:
      event-type:
        required: true
        type: string
        description: The event type to broadcast when build is done; lib-release or pom-release
      property-name:
        type: string
        description: For lib-release, the name of the POM property consumers use to configure the version of this library
      group-id:
        type: string
        description: For pom-release, the artifact groupId
      artifact-id:
        type: string
        description: For pom-release, the artifactId
    secrets:
      GH_PACKAGES_USERNAME:
        required: true
      GH_PACKAGES_TOKEN:
        required: true

jobs:
  deployNewVersion:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allow pushing updated pom.xml
      packages: write # Allow deploying packages
    timeout-minutes: 30
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          # server-id: avanet-github # Value of the distributionManagement/repository/id field of the pom.xml
          # settings-path: ${{ github.workspace }} # location for the settings.xml file
      - name: Build with Maven
        run: mvn package -s local-settings.xml --batch-mode
        env: # Credentials allowed to fetch packages from other repos
          GITHUB_USERNAME: '${{ secrets.GH_PACKAGES_USERNAME }}'
          GITHUB_TOKEN: '${{ secrets.GH_PACKAGES_TOKEN }}'
      - name: Configure Git
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
      # Reversed to avoid masking
      - run: |
          echo "GitHub user used to release, reversed:"
          echo ${{ github.actor }} | rev
      - name: Release prepare
        run: mvn release:prepare  -P no-analysis -DlocalCheckout=true -s local-settings.xml --batch-mode

      # Get version for dispatching to consumer repos
      - name: Extract released version
        id: get-version
        run: |
          VERSION=$(grep '^project.rel.' release.properties | head -1 | cut -d= -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Release perform
        run: mvn release:perform -P no-analysis -DlocalCheckout=true -s local-settings.xml --batch-mode
        env: # Credentials allowed to push to repo
          GITHUB_USERNAME: '${{ github.actor }}'
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
      #- name: Debug Git
      #  if: ${{ always() }}
      #  run: git reflog
  broadcast-update:
    needs: deployNewVersion
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo:
          - avanet-alarm-api
          - avanet-alarm-contract
          - avanet-api
          - avanet-api-contract
          - avanet-browser-tests
          - avanet-common
          - avanet-data-ingestion-api
          - avanet-deviceagent
          - avanet-deviceagent-infra
          - avanet-deviceagent-sensorbee
          - avanet-github-packages
          - avanet-heartbeat
          - avanet-i18n
          - avanet-invoice-api
          - avanet-invoice-contract
          - avanet-measurement-api
          - avanet-measurement-contract
          - avanet-notification-api
          - avanet-notification-contract
          - avanet-quarkus-parent
          - avanet-report-contract
          - avanet-report-service
          - avanet-rest-api
          - avanet-rest-api-new
          - avanet-user-api
          - avanet-user-contract
          - avanet-waveform-util
          - avanet-websockets
    steps:
      - name: Dispatch to ${{ matrix.repo }}
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.GH_PACKAGES_TOKEN }}
          repository: ava-monitoring/${{ matrix.repo }}
          event-type: ${{ inputs.event-type }}
          client-payload: >-
            {"groupId": "${{ inputs.group-id }}", "artifactId": "${{ inputs.artifact-id }}",
             "property-name": "${{ inputs.property-name }}", 
             "version": "${{ needs.deployNewVersion.outputs.version }}", "actor": "${{ github.actor }}"}